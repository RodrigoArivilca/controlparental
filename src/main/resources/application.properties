# Nombre de la aplicación
spring.application.name=control_parental

# Configuración de la conexión a PostgreSQL
# Variables de entorno obligatorias; no se incluye una conexión por defecto.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
# Se conserva 'update'; usarlo solo con una base de desarrollo aislada.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jackson.modules.scan=false

spring.mvc.converters.preferred-json-mapper=jackson
spring.jackson.serialization.fail-on-empty-beans=false

# Configuración para subir fotos y audios (Multimedia)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Credenciales externas. SecurityConfig conserva el acceso público existente.
spring.security.user.name=${APP_SECURITY_USERNAME}
spring.security.user.password=${APP_SECURITY_PASSWORD}
