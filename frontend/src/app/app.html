@if (isLoginPage()) {

  <router-outlet />

} @else {

  <a class="skip-link" href="#contenido">
    Saltar al contenido
  </a>

  <div class="app-shell">

    <aside class="sidebar">

      <a
        class="brand"
        routerLink="/dispositivos"
        aria-label="SaludPlus, dispositivos">

        <span class="brand-mark" aria-hidden="true">
          S+
        </span>

        <span>
          SALUDPLUS <b>PRO</b>
          <small>Control parental</small>
        </span>

      </a>

      <nav aria-label="Navegación principal">

        <p class="nav-label">
          GENERAL
        </p>

        <a
          class="nav-item"
          routerLink="/dispositivos"
          routerLinkActive="active"
          ariaCurrentWhenActive="page">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            aria-hidden="true">

            <rect
              x="6"
              y="2"
              width="12"
              height="20"
              rx="3" />

            <path d="M10 18h4" />

          </svg>

          Dispositivos
        </a>

        <a
          class="nav-item"
          routerLink="/usuarios"
          routerLinkActive="active"
          ariaCurrentWhenActive="page">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            aria-hidden="true">

            <path
              d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />

            <circle cx="9" cy="7" r="4" />

            <path
              d="M22 21v-2a4 4 0 0 0-3-3.87" />

            <path
              d="M16 3.13a4 4 0 0 1 0 7.75" />

          </svg>

          Usuarios
        </a>

        <a
          class="nav-item"
          routerLink="/mapa"
          routerLinkActive="active"
          ariaCurrentWhenActive="page">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            aria-hidden="true">

            <path
              d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2zM9 3v16M15 5v16" />

          </svg>

          Mapa y ubicaciones
        </a>

      </nav>

      <p class="sidebar-footer">
        Un espacio para conocer<br />
        los dispositivos registrados.
      </p>

    </aside>

    <div class="workspace">

      <header class="topbar">

        <span>
          Control parental
        </span>

        <div class="user-area">

          @if (currentUser(); as user) {

            <div class="user-info">
              <strong>
                {{ user.nombres }} {{ user.apellidos }}
              </strong>

              <small>
                {{ user.rol }}
              </small>
            </div>

          }

          <button
            class="logout-button"
            type="button"
            (click)="logout()">

            Cerrar sesión

          </button>

        </div>

      </header>

      <main
        id="contenido"
        tabindex="-1">

        <router-outlet />

      </main>

    </div>

  </div>

}
